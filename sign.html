<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1"><title>Review and sign agreement</title>
<style>
:root{--ink:#232822;--muted:#73796f;--line:#e7e8e1;--green:#315d45;--bg:#f6f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:68px;background:#fbfaf7;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(calc((100vw - 920px)/2),24px);gap:10px;font-weight:700;font-size:18px}.mark{width:30px;height:30px;border-radius:9px;background:var(--green);color:white;display:grid;place-items:center;font:20px Georgia}.wrap{max-width:840px;margin:42px auto;padding:0 20px}.eyebrow{font-size:10px;color:var(--green);font-weight:750;text-transform:uppercase;letter-spacing:1.4px}.wrap h1{font:500 30px Georgia,serif;margin:8px 0}.sub{color:var(--muted);margin:0 0 20px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:25px 30px;box-shadow:0 12px 35px #303b3010}.meta{background:#f7f7f2;border-radius:8px;padding:13px 15px;font-size:12px;line-height:1.8;margin-bottom:23px}.terms{font:15px/1.8 Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.terms p{margin:0 0 16px}.sign{border-top:1px solid var(--line);margin-top:30px;padding-top:22px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input{width:100%;max-width:420px;padding:11px;border:1px solid #dfe1d9;border-radius:8px;font:inherit}.check{display:flex;gap:10px;margin:14px 0;color:#52584f;font-size:12px;align-items:flex-start}.check input{margin-top:3px}.btn{border:0;background:var(--green);color:white;font-weight:650;border-radius:8px;padding:11px 16px;font:inherit;cursor:pointer}.btn:disabled{opacity:.55;cursor:default}.message{padding:14px;border-radius:8px;background:#f5f7f2;color:#425645;margin:0 0 16px}.message.error{background:#fbefed;color:#8a3b32}.foot{font-size:11px;color:#888e84;margin-top:14px}.state{padding:40px 5px;text-align:center;color:var(--muted)}@media(max-width:600px){.top{padding:0 16px}.wrap{margin:24px auto;padding:0 12px}.card{padding:20px}}@media print{body{background:#fff}.top,.foot,.btn{display:none!important}.wrap{max-width:none;margin:0;padding:0}.card{border:0;box-shadow:none;padding:24px}.sign{break-inside:avoid}}
</style></head><body><header class="top"><div class="mark">C</div> clause</header><main class="wrap"><div class="eyebrow">Agreement for your review</div><h1 id="title">Loading agreement…</h1><p class="sub" id="sub"></p><section class="card"><div id="state" class="state">Loading your agreement securely…</div><div id="agreement" hidden><div class="meta" id="meta"></div><div class="terms" id="terms"></div><section class="sign" id="signBox"><div id="notice"></div><div class="field"><label for="signer" id="signerLabel">Client signature &mdash; Type your full legal name</label><input id="signer" autocomplete="name" placeholder="Your full legal name" maxlength="160"></div><label class="check"><input id="consent" type="checkbox"><span>I have reviewed this agreement. I intend to sign it electronically, and I understand that my typed name and the time of submission will be recorded as my signature.</span></label><button class="btn" id="signBtn" disabled>Sign agreement</button><div class="foot">Your signing link is private. A signed confirmation will appear here once submitted.</div></section></div></section><p class="foot">Questions about the terms? Contact the person who sent you this agreement before signing.</p></main>
<script>
(()=>{const token=new URLSearchParams(location.search).get('token')||'',el=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state=(msg,error=false)=>{el('state').hidden=false;el('state').className='state'+(error?' message error':'');el('state').textContent=msg};
const btn=el('signBtn'),name=el('signer'),consent=el('consent');function ready(){btn.disabled=!(name.value.trim()&&consent.checked)}name.addEventListener('input',ready);consent.addEventListener('change',ready);
if(!token){state('This signing link is missing or invalid.',true);return}
fetch('/api/sign?token='+encodeURIComponent(token)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load agreement');el('title').textContent=d.title;el('sub').textContent='Sent by '+d.provider+(d.date?' · Effective '+new Date(d.date+'T12:00:00').toLocaleDateString():'');el('meta').innerHTML='<strong>Between</strong> '+esc(d.provider)+' (“Provider”)<br><strong>And</strong> '+esc(d.client)+' (“Client”)';el('terms').innerHTML=String(d.terms).split(/\n\s*\n/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');el('state').hidden=true;el('agreement').hidden=false;
if(el('signerLabel')) el('signerLabel').innerHTML='Client signature &mdash; Type legal name for <strong>'+esc(d.client)+'</strong>';
if(d.status==='signed'){el('signBox').innerHTML='<div class="message" style="background:#edf7ed;color:#1e4620;border:1px solid #c8e6c9;"><strong>✓ Agreement Signed &amp; Executed</strong><br>This contract was signed by <strong>'+esc(d.signer)+'</strong> on '+new Date(d.signedAt).toLocaleString()+'.</div><button class="btn" onclick="window.print()">Print / save signed copy</button>';}}
).catch(e=>state(e.message,true));
btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Recording signature…';el('notice').textContent='';try{const r=await fetch('/api/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,signer:name.value.trim(),consent:consent.checked})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not record signature');el('signBox').innerHTML='<div class="message">Signed successfully. Your signature was recorded at '+new Date().toLocaleString()+'.</div><button class="btn" onclick="window.print()">Print / save signed copy</button>';el('title').textContent='Agreement signed';}catch(e){el('notice').innerHTML='<div class="message error">'+esc(e.message)+'</div>';btn.disabled=false;btn.textContent='Sign agreement'}});
})();
</script></body></html>
